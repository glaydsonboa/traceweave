name: Continuous Traffic Logger

on:
  schedule:
    # Diario as 00:05 UTC (21:05 BRT) — o endpoint so guarda 14 dias; este workflow acumula para sempre.
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Uma execucao por vez: duas coletas simultaneas (agendada + manual) nao disputam o push.
concurrency:
  group: traffic-logger
  cancel-in-progress: false

jobs:
  log-traffic:
    # Fixado para evitar mudanca implicita quando ubuntu-latest migrar para 26.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Execute Traffic Backup Script
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Preferir um PAT (secrets.TRAFFIC_TOKEN) com acesso de push: o GITHUB_TOKEN nativo
          # nem sempre consegue ler os endpoints de trafego. Fallback: GITHUB_TOKEN.
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/backup-traffic.py

      - name: Commit and Push Cumulative Logs
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Traffic Logger"
          git add research/traffic-data/
          if git diff --cached --quiet; then
            echo "Nenhuma metrica nova detectada hoje."
          else
            git commit -m "chrono: update cumulative traffic logs [skip ci]"
            # O checkout tem profundidade 1: se outro escritor avancar o branch depois dele, o push
            # direto e rejeitado (non-fast-forward). Integra o que chegou e tenta de novo; falha de
            # verdade (conflito persistente) derruba o passo em vez de passar em silencio.
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin "${TARGET_BRANCH}" && git push origin "HEAD:${TARGET_BRANCH}"; then
                pushed=1
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
            done
            if [ "$pushed" != 1 ]; then
              echo "push falhou apos 3 tentativas" >&2
              exit 1
            fi
          fi
