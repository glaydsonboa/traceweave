[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceweave"
version = "0.1.0"
description = "Verifiable continuity and provenance for AI coding sessions — protocol 0.1 reference implementation"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
traceweave = "traceweave.cli:main"

[tool.setuptools.packages.find]
include = ["traceweave*"]
