[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceweave"
version = "0.1.0"
description = "Verifiable continuity and provenance for AI coding sessions — protocol 0.1 reference implementation"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  # traceweave.v2.provenance loads ZoneInfo("America/Sao_Paulo") at import; Windows has no
  # system time zone database, so without tzdata that module does not import.
  "tzdata",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
traceweave = "traceweave.cli:main"
traceweave-mcp = "traceweave.mcp_server:main"

[tool.setuptools.packages.find]
include = ["traceweave*"]
