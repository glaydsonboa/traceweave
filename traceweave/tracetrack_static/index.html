<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>traceweave</title>
<!-- Layout: WORION_UI_SANDBOX_MOCKUP_2026-10-07.html (ChatGPT), adaptado. Logomarca provisória. -->
<style>
:root{--bg:#070809;--panel:#0d0f11;--raised:#1b1d20;--line:#282c31;--text:#f3f4f6;--muted:#8e96a0;--faint:#606873;
  --accent:#d9f99d;--ok:#86efac;--warn:#fcd34d;--bad:#fca5a5;--run:#93c5fd;--rail:58px;--pane:440px;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit;color:inherit}
.shell{height:100vh;overflow:hidden;position:relative}
html,body{overflow:hidden}

/* rail */
.rail{position:absolute;z-index:30;inset:0 auto 0 0;width:var(--rail);background:#090a0b;border-right:1px solid var(--line);
  padding:12px 8px;display:flex;flex-direction:column;gap:5px;overflow:hidden;transition:.18s}
.rail:hover,.rail:focus-within{width:248px;box-shadow:20px 0 70px #0008}
.brand,.nav,.profile{height:42px;display:flex;align-items:center;gap:14px;white-space:nowrap;padding:0 10px}
.brand{height:50px}
.nav,.profile{border:0;background:transparent;border-radius:10px;color:#a8afb8;cursor:pointer;text-align:left}
.nav:hover,.nav.active,.profile:hover{background:#191c20;color:#fff}
.ico{width:22px;text-align:center;color:#b7cee5;font-size:18px;flex:none}
.lbl{opacity:0;transition:.12s}.rail:hover .lbl,.rail:focus-within .lbl{opacity:1}
.sp{flex:1}
.avatar{width:30px;height:30px;border:1px solid #343941;border-radius:9px;display:grid;place-items:center;font-size:11px;flex:none}

/* logomarca (provisória) */
.logo{display:inline-flex;align-items:center;gap:10px;color:var(--text);text-decoration:none}
.logo svg{width:24px;height:24px;flex:none}
.logo .word{font-weight:600;letter-spacing:-.01em;font-size:15px}
.logo .word b{font-weight:600;color:var(--accent)}

/* workspace */
.workspace{height:100vh;margin-left:var(--rail);position:relative;transition:margin-right .2s;display:flex;flex-direction:column}
.top{height:54px;padding:0 20px;display:flex;align-items:center;flex:none}
.ghost{height:34px;border:0;background:transparent;color:var(--muted);border-radius:9px;cursor:pointer;padding:0 10px}
.ghost:hover{background:#17191c;color:#fff}
.stage{flex:1;overflow:auto;padding:0 22px 170px}
.greet{height:100%;display:grid;place-items:center}
.greet h1{font:400 31px Georgia,serif;letter-spacing:-.02em;margin:-60px 0 0;text-align:center}
.greet p{color:var(--faint);font-size:13px;text-align:center;margin:10px 0 0}

/* dock + composer */
.dock{position:absolute;left:0;right:0;bottom:0;padding:28px 22px 14px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.composer{width:min(800px,calc(100vw - var(--rail) - 60px));margin:auto;background:var(--raised);border:1px solid #30343a;border-radius:23px;padding:10px 12px 8px}
.composer textarea{width:100%;height:38px;max-height:140px;resize:none;border:0;outline:0;background:transparent;padding:3px 5px}
.row{display:flex;align-items:center;gap:8px}
.circle,.pill{height:32px;border:1px solid #343941;background:#17191c;cursor:pointer}
.circle{width:32px;border-radius:50%}
.pill{border-radius:17px;padding:0 11px;font-size:12px;color:#cbd0d7}
.pill option{background:#17191c}
.send{background:#f2f4f7;color:#121417}.send:disabled{opacity:.35;cursor:default}
.wd{font:11px ui-monospace,Consolas,monospace;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disc{text-align:center;font-size:11px;color:var(--faint);margin:8px 0 0}

/* detail (center) */
.detail{max-width:860px;margin:4px auto 0}
.detail h2{font:400 22px Georgia,serif;margin:0 0 6px;display:flex;align-items:center;gap:10px}
.meta{color:var(--muted);font:12px/1.55 ui-monospace,Consolas,monospace;word-break:break-all}
.card{background:#111317;border:1px solid #25292f;border-radius:14px;padding:15px;margin-bottom:12px}
.detail .card{margin-top:12px;margin-bottom:0}
.card h3{margin:0 0 7px;font-size:14px}
.card p{color:#9aa2ad;font-size:13px;line-height:1.5;margin:0;white-space:pre-wrap;word-break:break-word}
.eye{font-size:10px;letter-spacing:.12em;color:#717a85;text-transform:uppercase}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kv b{display:block;font-size:20px;font-weight:500}.kv span{color:var(--muted);font-size:12px}
.finding{border-left:2px solid var(--bad);padding:6px 0 6px 12px;margin:10px 0 0}
.finding .tag{font:12px ui-monospace,Consolas,monospace;color:var(--bad)}
.finding .ev{color:var(--muted);font-size:13px;margin-top:2px}
.clean{color:var(--ok)!important}
.acts{font:12px ui-monospace,Consolas,monospace;color:var(--muted);max-height:260px;overflow:auto}
.acts div{padding:2px 0;border-bottom:1px solid #16191e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term{background:#070809;border:1px solid #282d33;border-radius:9px;padding:10px;max-height:320px;white-space:pre-wrap;overflow:auto;
  font:12px/1.5 ui-monospace,Consolas,monospace;color:#cbd1d8;word-break:break-word}
.gate{display:flex;gap:8px;margin-top:10px}
.gate input{flex:1;background:#08090b;border:1px solid #2d3238;border-radius:9px;padding:9px 10px;font-family:ui-monospace,Consolas,monospace;text-transform:uppercase}
.primary,.secondary{border:1px solid #343941;border-radius:9px;padding:8px 12px;cursor:pointer}
.primary{background:#edf0f2;color:#111417}.secondary{background:#17191c}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:1em}

/* workpane — TraceTrack */
.pane{position:absolute;z-index:35;inset:0 0 0 auto;width:var(--pane);min-width:340px;max-width:min(680px,65vw);background:var(--panel);
  border-left:1px solid var(--line);transform:translateX(102%);transition:transform .22s;box-shadow:-24px 0 70px #0005;display:flex;flex-direction:column}
.pane.open{transform:none}
.handle{position:absolute;left:-5px;width:10px;height:100%;cursor:col-resize}
.ph{height:78px;border-bottom:1px solid var(--line);padding:15px 16px 12px 22px;display:flex;align-items:center;flex:none}
.ph h2{font-size:15px;margin:4px 0 0}
.pb{flex:1;overflow:auto;padding:18px}
.sec{margin:4px 2px 10px}
.item{cursor:pointer}.item:hover,.item.sel{border-color:#3a3f46;background:#15171b}
.item .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item h3{margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid #30353b;border-radius:999px;padding:3px 8px;color:#a8afb8;font-size:11px;white-space:nowrap}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:#69717b}
.badge.ok:before{background:var(--ok)}.badge.run:before{background:var(--run)}.badge.wait:before{background:var(--warn)}.badge.bad:before{background:var(--bad)}
.empty{color:var(--faint);font-size:13px;margin:0 2px 14px}
.toast{position:fixed;z-index:60;bottom:110px;left:50%;transform:translateX(-50%);background:#202225;border:1px solid #383c42;padding:9px 14px;border-radius:12px;font-size:13px;display:none}

@media(min-width:1180px){.shell.pinned .workspace{margin-right:var(--pane)}}
@media(max-width:800px){:root{--rail:50px}.pane{width:min(92vw,440px);max-width:92vw}.composer{width:calc(100vw - var(--rail) - 20px)}
  .greet h1{font-size:26px}.wd{display:none}.logo .word{display:none}.stage{padding:0 12px 170px}.dock{padding:24px 10px 12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <aside class="rail">
    <div class="brand"><span class="logo" title="traceweave"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3 8c3 0 3 8 6 8s3-8 6-8 3 8 6 8" stroke="#f3f4f6" stroke-width="2" stroke-linecap="round"/>
      <path d="M3 16c3 0 3-8 6-8s3 8 6 8 3-8 6-8" stroke="#d9f99d" stroke-width="2" stroke-linecap="round"/></svg></span>
      <span class="lbl" style="font-weight:600">traceweave</span></div>
    <button class="nav active" id="nav-new"><span class="ico">＋</span><span class="lbl">Novo job</span></button>
    <button class="nav" id="nav-track"><span class="ico">▥</span><span class="lbl">TraceTrack</span></button>
    <div class="sp"></div>
    <button class="profile"><span class="avatar" id="avatar">··</span><span class="lbl" id="username"></span></button>
  </aside>

  <main class="workspace">
    <header class="top">
      <a class="logo" href="/" title="traceweave"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 8c3 0 3 8 6 8s3-8 6-8 3 8 6 8" stroke="#f3f4f6" stroke-width="2" stroke-linecap="round"/>
        <path d="M3 16c3 0 3-8 6-8s3 8 6 8 3-8 6-8" stroke="#d9f99d" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="word">trace<b>weave</b></span></a>
      <span class="sp"></span>
      <button class="ghost" id="paneToggle" title="TraceTrack">▥</button>
    </header>
    <section class="stage" id="stage"></section>
    <div class="dock">
      <form class="composer" id="composer" autocomplete="off">
        <textarea id="prompt" placeholder="Digite o prompt..."></textarea>
        <div class="row">
          <span class="wd" id="workdir"></span>
          <span class="sp"></span>
          <select class="pill" id="executor" aria-label="executor">
            <option value="claude">⌁ Claude</option>
            <option value="codex">⌁ Codex</option>
            <option value="deepseek">⌁ DeepSeek</option>
          </select>
          <button class="circle send" id="send" type="submit" disabled title="enviar">↑</button>
        </div>
      </form>
      <p class="disc">O job só roda depois que o PROMPT_ID enviado fora da página é digitado de volta.</p>
    </div>
  </main>

  <aside class="pane" id="pane" aria-label="TraceTrack">
    <div class="handle" id="handle"></div>
    <header class="ph"><div><div class="eye">rastro do trace</div><h2>TraceTrack</h2></div>
      <span class="sp"></span><button class="ghost" id="close" title="colapsar">×</button></header>
    <div class="pb" id="queue"></div>
  </aside>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = { user: "", jobs: [], sessions: [], view: { kind: "home" }, detail: {}, gateError: null, draftCode: "" };
const read = (k) => { try { return localStorage.getItem(k); } catch (_) { return null; } };
const write = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3400); }
const when = (iso) => iso ? new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
const size = (b) => b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB";
const greeting = () => { const h = new Date().getHours(); return h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite"; };
const EXEC = { claude: "Claude", codex: "Codex", deepseek: "DeepSeek" };
const STATUS = { awaiting_authorization: ["aguardando PROMPT_ID", "wait"], running: ["rodando", "run"], done: ["concluído", "ok"],
  failed: ["falhou", "bad"], expired: ["expirado", "bad"], locked: ["bloqueado", "bad"] };

/* workpane: abre, colapsa, redimensiona */
const pane = $("#pane"), shell = $("#shell");
function openPane() { pane.classList.add("open"); if (innerWidth >= 1180) shell.classList.add("pinned"); write("tt.pane", "1"); }
function closePane() { pane.classList.remove("open"); shell.classList.remove("pinned"); write("tt.pane", "0"); }
$("#paneToggle").onclick = $("#nav-track").onclick = () => pane.classList.contains("open") ? closePane() : openPane();
$("#close").onclick = closePane;
let resizing = false;
$("#handle").onpointerdown = (e) => { resizing = true; e.target.setPointerCapture(e.pointerId); };
onpointermove = (e) => { if (resizing) document.documentElement.style.setProperty("--pane", Math.max(340, Math.min(680, innerWidth - e.clientX)) + "px"); };
onpointerup = () => resizing = false;
onresize = () => { if (innerWidth < 1180) shell.classList.remove("pinned"); else if (pane.classList.contains("open")) shell.classList.add("pinned"); };
$("#nav-new").onclick = () => { state.view = { kind: "home" }; render(); $("#prompt").focus(); };

/* composer */
const ta = $("#prompt");
ta.addEventListener("input", () => { ta.style.height = "38px"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; $("#send").disabled = !ta.value.trim(); });
ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#composer").requestSubmit(); } });
$("#executor").value = read("tt.exec") || "claude";
$("#executor").onchange = (e) => write("tt.exec", e.target.value);
$("#composer").onsubmit = async (e) => {
  e.preventDefault();
  const prompt = ta.value.trim(); if (!prompt) return;
  $("#send").disabled = true;
  try {
    const job = await api("/api/jobs", { executor: $("#executor").value, prompt });
    ta.value = ""; ta.style.height = "38px";
    state.view = { kind: "job", id: job.job_id }; state.gateError = null; state.draftCode = "";
    await refreshJobs(); openPane();
    toast(job.delivery === "terminal" ? "PROMPT_ID enviado ao terminal do servidor" : "PROMPT_ID enviado por SMS");
  } catch (err) { toast(err.message); $("#send").disabled = false; }
};

/* dados */
async function refreshJobs() { state.jobs = await api("/api/jobs").catch(() => state.jobs); renderQueue(); if (state.view.kind === "job") renderStage(); }
async function refreshSessions() { state.sessions = await api("/api/sessions").catch(() => state.sessions); renderQueue(); }

function renderQueue() {
  const sel = state.view;
  const jobs = state.jobs.map((j) => {
    const [label, cls] = STATUS[j.status] || [j.status, ""];
    const nf = (j.findings || []).length;
    const sub = j.status === "done" || j.status === "failed"
      ? (j.transcript ? (nf ? `${nf} divergência(s)` : "sem divergências") : "transcript não localizado")
      : esc(j.prompt_id_hint || "");
    return `<div class="card item ${sel.kind === "job" && sel.id === j.job_id ? "sel" : ""}" data-job="${esc(j.job_id)}">
      <div class="top2"><span class="eye">${esc(EXEC[j.executor] || j.executor)} · ${when(j.created_at)}</span><span class="badge ${cls}">${esc(label)}</span></div>
      <h3>${esc(j.prompt)}</h3><p>${sub}</p></div>`;
  }).join("");
  const sessions = state.sessions.map((s) => `<div class="card item ${sel.kind === "session" && sel.id === s.id ? "sel" : ""}" data-session="${esc(s.id)}">
      <div class="top2"><span class="eye">${esc(EXEC[s.executor] || s.executor)} · ${when(s.modified)}</span><span class="badge">${size(s.bytes)}</span></div>
      <h3>${esc(s.name)}</h3></div>`).join("");
  $("#queue").innerHTML = `<div class="eye sec">fila</div>${jobs || '<p class="empty">Nenhum job. Escreva um prompt no composer.</p>'}
    <div class="eye sec">sessões nesta máquina</div>${sessions || '<p class="empty">Nenhuma sessão encontrada.</p>'}`;
  // Em tela estreita o painel cobre o detalhe: recolhe ao escolher um item.
  const narrow = () => { if (innerWidth < 1180) { pane.classList.remove("open"); shell.classList.remove("pinned"); } };
  $("#queue").querySelectorAll("[data-job]").forEach((el) => el.onclick = () => { narrow(); state.view = { kind: "job", id: el.dataset.job }; render(); });
  $("#queue").querySelectorAll("[data-session]").forEach((el) => el.onclick = () => { narrow(); openSession(el.dataset.session); });
}

async function openSession(id) {
  state.view = { kind: "session", id }; renderQueue();
  $("#stage").innerHTML = `<div class="detail"><p class="meta">auditando o log…</p></div>`;
  try { state.detail[id] = await api("/api/session?id=" + encodeURIComponent(id)); }
  catch (err) { $("#stage").innerHTML = `<div class="detail"><p class="err">${esc(err.message)}</p></div>`; return; }
  if (state.view.kind === "session" && state.view.id === id) renderStage();
}

function findingsCard(list) {
  if (!list.length) return `<div class="card"><div class="eye">traceweave claims</div><h3>Divergências</h3>
    <p class="clean">Nenhuma. As afirmações conferidas batem com o log — isso não prova que o trabalho está certo.</p></div>`;
  return `<div class="card"><div class="eye">traceweave claims</div><h3>Divergências · ${list.length}</h3>${list.map((f) => `
    <div class="finding"><div class="tag">${esc(f.check)} · ${esc(f.error_class)} · linha ${f.line} · ${esc(f.ts)}</div>
    <p>${esc(f.claim)}</p><div class="ev">${esc(f.evidence)}</div></div>`).join("")}</div>`;
}

function renderStage() {
  const v = state.view, st = $("#stage");
  if (v.kind === "home") {
    st.innerHTML = `<div class="greet"><div><h1>${greeting()}, ${esc(state.user)}.</h1><p>Escolha uma sessão no TraceTrack ou escreva um prompt.</p></div></div>`;
    return;
  }
  if (v.kind === "session") {
    const d = state.detail[v.id]; if (!d) return;
    st.innerHTML = `<div class="detail">
      <h2>${esc(EXEC[d.executor] || d.executor)} <span class="badge">${when(d.modified)}</span></h2>
      <div class="meta">${esc(d.path)}<br>SHA-256 ${esc(d.sha256)} · ${size(d.bytes)}</div>
      <div class="card kv"><div><b>${d.prompts}</b><span>prompts</span></div><div><b>${d.tool_calls}</b><span>ações</span></div>
        <div><b>${d.events}</b><span>eventos</span></div><div><b>${d.findings.length}</b><span>divergências</span></div></div>
      ${findingsCard(d.findings)}
      <div class="card"><div class="eye">extraído do log</div><h3>Primeiro prompt</h3><p>${esc(d.first_prompt || "—")}</p></div>
      <div class="card"><div class="eye">extraído do log</div><h3>Último prompt</h3><p>${esc(d.last_prompt || "—")}</p></div>
      <div class="card"><div class="eye">tool calls</div><h3>Ações realizadas · últimas ${d.recent_actions.length}</h3>
        <div class="acts">${d.recent_actions.map((a) => `<div title="${esc(a.action)}">${esc(when(a.ts))} · L${a.line} · ${esc(a.action)}</div>`).join("") || "—"}</div></div>
      <div class="card"><div class="eye">agente</div><h3>Última resposta</h3><p>${esc(d.last_answer || "—")}</p></div>
    </div>`;
    return;
  }
  if (v.kind === "job") {
    const j = state.jobs.find((x) => x.job_id === v.id); if (!j) { st.innerHTML = ""; return; }
    const [label, cls] = STATUS[j.status] || [j.status, ""];
    const gate = j.status === "awaiting_authorization" ? `<div class="card"><div class="eye">portão</div><h3>Autorizar</h3>
        <p>O PROMPT_ID foi enviado ${j.delivery === "terminal" ? "ao terminal onde o servidor está rodando" : "por SMS"}. Digite-o para o job começar. Expira em 10 minutos; 3 tentativas.</p>
        <form class="gate" id="gate"><input id="code" placeholder="TW-…" autocomplete="one-time-code" spellcheck="false"><button class="primary">Autorizar</button></form>
        <div class="err">${esc(state.gateError && state.gateError.job === j.job_id ? state.gateError.msg : "")}</div></div>` : "";
    const ended = j.status === "done" || j.status === "failed";
    st.innerHTML = `<div class="detail">
      <h2>${esc(EXEC[j.executor])} <span class="badge ${cls}">${esc(label)}</span></h2>
      <div class="meta">job ${esc(j.job_id)} · criado ${when(j.created_at)}${j.started_at ? " · início " + when(j.started_at) : ""}${j.ended_at ? " · fim " + when(j.ended_at) : ""}${j.exit_code !== null ? " · saída " + j.exit_code : ""}<br>workdir ${esc(j.workdir)}${j.status !== "awaiting_authorization" ? "<br>PROMPT_ID " + esc(j.prompt_id_hint) : ""}</div>
      <div class="card"><div class="eye">prompt</div><p>${esc(j.prompt)}</p></div>
      ${gate}
      ${j.error ? `<div class="card"><div class="eye">erro</div><p class="err">${esc(j.error)}</p></div>` : ""}
      ${ended ? (j.transcript ? findingsCard(j.findings || []) + `<div class="meta" style="margin-top:8px">transcript ${esc(j.transcript)}</div>`
                              : `<div class="card"><div class="eye">traceweave claims</div><p>Transcript da sessão não localizado; nada foi auditado.</p></div>`) : ""}
      ${j.log && j.log.length ? `<div class="card"><div class="eye">execução</div><div class="term" id="log">${esc(j.log.join("\n"))}</div></div>` : ""}
    </div>`;
    const log = $("#log"); if (log) log.scrollTop = log.scrollHeight;
    const g = $("#gate");
    if (g) {
      const input = $("#code"); input.value = state.draftCode; input.oninput = () => state.draftCode = input.value; input.focus();
      g.onsubmit = async (e) => {
        e.preventDefault();
        try { await api(`/api/jobs/${encodeURIComponent(j.job_id)}/authorize`, { prompt_id: input.value }); state.draftCode = ""; state.gateError = null; }
        catch (err) { state.gateError = { job: j.job_id, msg: err.message }; }
        await refreshJobs();
      };
    }
  }
}
function render() { renderQueue(); renderStage(); }

(async function init() {
  try {
    const s = await api("/api/state");
    state.user = s.user; $("#avatar").textContent = (s.user || "··").slice(0, 2).toUpperCase(); $("#username").textContent = s.user;
    $("#workdir").textContent = s.workdir;
    if (!s.deepseek_ready) { const o = $("#executor option[value=deepseek]"); o.disabled = true; o.textContent = "⌁ DeepSeek (sem chave)"; }
  } catch (_) {}
  // Em tela estreita o painel cobre o conteúdo: só abre sozinho quando há espaço para fixá-lo ao lado.
  if (read("tt.pane") !== "0" && innerWidth >= 1180) openPane();
  render(); refreshSessions(); refreshJobs();
  setInterval(() => { if (!(document.activeElement && document.activeElement.id === "code")) refreshJobs(); }, 2000);
  setInterval(refreshSessions, 30000);
})();
</script>
</body>
